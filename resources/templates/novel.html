<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="txt-body-sha256" content="{{ txt_body_hash }}">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>{{ chapter.translated_work_title }}－{{ chapter.translated_chapter_title }}</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f4f1ea;
      --surface: #fffdf8;
      --text: #282521;
      --muted: #6c655d;
      --accent: #835b36;
      --border: #ded6ca;
      --shadow: rgb(59 43 27 / 10%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #171513;
        --surface: #211e1b;
        --text: #eee8df;
        --muted: #b9afa4;
        --accent: #dfb382;
        --border: #443d36;
        --shadow: rgb(0 0 0 / 28%);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "Noto Serif TC", "Noto Serif CJK TC", "Microsoft JhengHei",
        "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(17px, 1.2vw + 13px, 21px);
      line-height: 1.95;
    }

    main {
      width: min(100% - 32px, 820px);
      margin: clamp(24px, 6vw, 72px) auto;
      padding: clamp(24px, 5vw, 64px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 16px 50px var(--shadow);
    }

    header {
      margin-bottom: 2.6rem;
      padding-bottom: 1.6rem;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.65rem, 4vw, 2.45rem);
      line-height: 1.35;
      letter-spacing: 0.025em;
    }

    h2 {
      margin: 0;
      color: var(--muted);
      font-size: 1.08rem;
      font-weight: 500;
    }

    .metadata {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 1.1rem;
      margin-top: 1.1rem;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.78rem;
      line-height: 1.55;
    }

    a { color: var(--accent); }

    .novel-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: normal;
      letter-spacing: 0.035em;
    }

    footer {
      margin-top: 3rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.72rem;
      text-align: center;
    }

    @media (max-width: 560px) {
      main {
        width: 100%;
        margin: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>{{ chapter.translated_work_title }}</h1>
      <h2>{{ chapter.translated_chapter_title }}</h2>
      <div class="metadata">
        <span>原文：{{ source.title }}－{{ source.chapter_title }}</span>
        <span>翻譯引擎：{{ chapter.provider }} / {{ chapter.model }}</span>
        <a href="{{ source.source_url }}" target="_blank" rel="noopener noreferrer">原文來源</a>
      </div>
    </header>

    <article class="novel-text">{{ translated_text }}</article>

    <!-- AUTOTRANSLATER_NAV_START -->
    <nav class="chapter-navigation" aria-label="翻譯章節導覽" style="display:flex;justify-content:space-between;gap:1rem;margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--border);font-family:system-ui,sans-serif;font-size:.9rem">
      <span class="chapter-navigation-disabled" style="color:var(--muted);opacity:.65">沒有上一章</span>
      <span class="chapter-navigation-disabled" style="color:var(--muted);opacity:.65">沒有下一章</span>
    </nav>
    <!-- AUTOTRANSLATER_NAV_END -->

    <footer>由日文小說繁體中文翻譯器產生</footer>
  </main>
</body>
</html>
