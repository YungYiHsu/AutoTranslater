[project]
name = "autotranslater"
version = "0.3.0"
description = "日文網路小說繁體中文翻譯器"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-genai>=2.18.1",
    "jinja2>=3.1.6",
    "lxml>=6.1.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyinstaller>=6.22.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "types-requests>=2.33.0.20260712",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
